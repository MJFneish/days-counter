# Days Counter for iOS — XcodeGen spec (`xcodegen generate` writes DaysCounter.xcodeproj, which is
# not committed). The countdown engine and the app logic live in the DaysCounterCore Swift package,
# shared by the app and its widget extension and tested on its own with `swift test`; the widget's
# faces (Shared/) are compiled into both, so the app's UI test can screenshot them. The app and the
# widget share their data through the App Group. Same layout as Mawakit's ios/. Built and tested on
# GitHub's macOS runners (.github/workflows/ci.yml) — there is no Mac on the development machine.
name: DaysCounter
options:
  bundleIdPrefix: com.devlance
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    # Keep in step with android/version.properties (`yarn bump` in android/ updates both; iOS gets
    # the version without its "-alpha.N" suffix, the build number tells those apart).
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "106"
    # The full version name ("2.0.0-alpha.4"), shown in Settings → About as on Android.
    APP_VERSION_NAME: "2.0.0"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  DaysCounterCore:
    path: DaysCounterCore

targets:
  DaysCounter:
    type: application
    platform: iOS
    sources:
      - path: DaysCounter
      - path: Shared
    dependencies:
      - package: DaysCounterCore
      - target: DaysCounterWidgets
    entitlements:
      path: DaysCounter/DaysCounter.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.devlance.dayscounter
    info:
      path: DaysCounter/Info.plist
      properties:
        CFBundleDisplayName: Days Counter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DCVersionName: $(APP_VERSION_NAME)
        CFBundleLocalizations: [en, ar]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devlance.dayscounter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  DaysCounterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DaysCounterWidgets
      - path: Shared
    dependencies:
      - package: DaysCounterCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: DaysCounterWidgets/DaysCounterWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.devlance.dayscounter
    info:
      path: DaysCounterWidgets/Info.plist
      properties:
        CFBundleDisplayName: Days Counter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devlance.dayscounter.widgets
        TARGETED_DEVICE_FAMILY: "1"

  DaysCounterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DaysCounterUITests
    dependencies:
      - target: DaysCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devlance.dayscounter.uitests
        TEST_TARGET_NAME: DaysCounter

schemes:
  DaysCounter:
    build:
      targets:
        DaysCounter: all
        DaysCounterWidgets: all
    test:
      targets:
        - DaysCounterUITests
