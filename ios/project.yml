# Days Counter for iOS — XcodeGen spec (`xcodegen generate` writes DaysCounter.xcodeproj, which is
# not committed). The countdown engine and the app logic live in the DaysCounterCore Swift package,
# shared by the app (and, from the widget phase on, its widget extension) and tested on its own
# with `swift test`. Same layout as Mawakit's ios/. Built and tested on GitHub's macOS runners
# (.github/workflows/ci.yml) — there is no Mac on the development machine.
name: DaysCounter
options:
  bundleIdPrefix: com.devlance
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    # Keep in step with android/version.properties (`yarn bump` in android/ updates both; iOS gets
    # the version without its "-alpha.N" suffix, the build number tells those apart).
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "102"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  DaysCounterCore:
    path: DaysCounterCore

targets:
  DaysCounter:
    type: application
    platform: iOS
    sources:
      - path: DaysCounter
    dependencies:
      - package: DaysCounterCore
    info:
      path: DaysCounter/Info.plist
      properties:
        CFBundleDisplayName: Days Counter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ar]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devlance.dayscounter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  DaysCounterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DaysCounterUITests
    dependencies:
      - target: DaysCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devlance.dayscounter.uitests
        TEST_TARGET_NAME: DaysCounter

schemes:
  DaysCounter:
    build:
      targets:
        DaysCounter: all
    test:
      targets:
        - DaysCounterUITests
